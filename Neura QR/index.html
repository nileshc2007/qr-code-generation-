<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Treasure Hunt</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stars"></div>
<main class="card">
  <div class="badge">🔎 CAMPUS TREASURE HUNT</div>
  <h1 id="title">Your Next Clue</h1>
  <div class="map-icon">🧭</div>
  <p class="intro" id="intro">Follow the clue, find the location, and continue the hunt.</p>
  <section class="clue-box">
    <span class="label">CLUE <span id="clueNumber">1</span></span>
    <p id="clueText">Your clue will appear here.</p>
  </section>
  <button id="hintBtn">💡 Show Hint</button>
  <p id="hint" class="hint hidden"></p>
  <div id="final" class="final hidden">
    <div class="trophy">🏆</div>
    <h2>YOU FOUND IT!</h2>
    <p>Congratulations, detective! You have reached the final destination.</p>
  </div>
  <p class="footer">Good luck. Think smart. Have fun!</p>
</main>
<script src="script.js"></script>
</body>
</html>
